<div class="card" style="max-width:440px; margin:0 auto;">
  <div style="display:flex; gap:6px; margin-bottom:16px;">
    <button type="button" id="auth-tab-login" onclick="toggleAuthForm('login')" style="flex:1;">로그인</button>
    <button type="button" id="auth-tab-signup" class="secondary" onclick="toggleAuthForm('signup')" style="flex:1;">회원가입</button>
    <button type="button" id="auth-tab-reset" class="secondary" onclick="toggleAuthForm('reset')" style="flex:1;">비밀번호 찾기</button>
  </div>

  <form id="login-form" onsubmit="handleLogin(event)">
    <div style="margin-bottom:10px;"><label>이메일</label><input type="email" id="login-email" required /></div>
    <div style="margin-bottom:12px;"><label>비밀번호</label><input type="password" id="login-password" required /></div>
    <button type="submit" style="width:100%;">로그인</button>
  </form>

  <form id="signup-form" class="hidden" onsubmit="handleSignup(event)">
    <div style="margin-bottom:10px;"><label>이메일</label><input type="email" id="signup-email" placeholder="example@email.com" required /></div>
    <div style="margin-bottom:10px;"><label>닉네임 (2~20자)</label><input type="text" id="signup-nickname" minlength="2" maxlength="20" required /></div>
    <div style="margin-bottom:10px;"><label>비밀번호 (6자 이상)</label><input type="password" id="signup-password" minlength="6" required /></div>
    <div style="margin-bottom:12px;"><label>비밀번호 확인</label><input type="password" id="signup-password-confirm" minlength="6" required /></div>
    <button type="submit" style="width:100%;">가입하기</button>
  </form>

  <div id="reset-form-box" class="hidden">
    <form onsubmit="handleRequestPasswordReset(event)" style="margin-bottom:14px; padding-bottom:14px; border-bottom:1px dashed #cbd5e1;">
      <label>가입한 이메일 주소</label>
      <div style="display:flex; gap:6px;">
        <input type="email" id="reset-email" placeholder="가입된 이메일 입력" required />
        <button type="submit" style="white-space:nowrap;">인증코드 발급</button>
      </div>
    </form>

    <form onsubmit="handleConfirmPasswordReset(event)">
      <div style="margin-bottom:10px;"><label>인증 코드 (6자리)</label><input type="text" id="reset-code" placeholder="발급받은 6자리 코드 입력" required /></div>
      <div style="margin-bottom:10px;"><label>새 비밀번호 (6자 이상)</label><input type="password" id="reset-new-password" minlength="6" required /></div>
      <div style="margin-bottom:12px;"><label>새 비밀번호 확인</label><input type="password" id="reset-new-password-confirm" minlength="6" required /></div>
      <button type="submit" style="width:100%; background:#0284c7;">비밀번호 재설정 완료</button>
    </form>
  </div>
</div>
