<div>
  <div class="card" style="padding:14px 20px; margin-bottom:14px;">
    <div class="admin-subnav" style="border-bottom:none; padding-bottom:0; margin-bottom:0;">
      <button type="button" id="btn-subtab-profile" class="subtab-btn active" onclick="switchAdminTab('profile')">내 정보</button>
      <button type="button" id="btn-subtab-modules" class="subtab-btn admin-tab-only hidden" onclick="switchAdminTab('modules')">도구(모듈) 관리</button>
      <button type="button" id="btn-subtab-users" class="subtab-btn admin-tab-only hidden" onclick="switchAdminTab('users')">회원 관리</button>
      <button type="button" id="btn-subtab-grades" class="subtab-btn admin-tab-only hidden" onclick="switchAdminTab('grades')">등급 관리</button>
      <button type="button" id="btn-subtab-forbidden" class="subtab-btn admin-tab-only hidden" onclick="switchAdminTab('forbidden')">금지 닉네임 관리</button>
    </div>
  </div>

  <!-- 탭 1: 내 정보 (닉네임 변경 + 비밀번호 변경 포함) -->
  <div id="admin-sec-profile" class="card">
    <h3 style="margin-top:0;">내 계정 정보</h3>
    <div id="my-profile-card" style="margin-bottom:20px;"></div>

    <div class="row" style="align-items:stretch;">
      <!-- 닉네임 변경 카드 -->
      <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:16px;">
        <h4 style="margin:0 0 10px 0;">닉네임 변경</h4>
        <form onsubmit="handleUpdateMyNickname(event)">
          <div style="margin-bottom:10px;">
            <label>새 닉네임 (2~20자, 중복 및 금지어 불가)</label>
            <input type="text" id="profile-new-nickname" minlength="2" maxlength="20" required />
          </div>
          <button type="submit">닉네임 변경하기</button>
        </form>
      </div>

      <!-- 비밀번호 변경 카드 -->
      <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:16px;">
        <h4 style="margin:0 0 10px 0;">비밀번호 변경</h4>
        <form onsubmit="handleChangeMyPassword(event)">
          <div style="margin-bottom:8px;">
            <label>현재 비밀번호</label>
            <input type="password" id="profile-cur-pw" required />
          </div>
          <div style="margin-bottom:8px;">
            <label>새 비밀번호 (6자 이상)</label>
            <input type="password" id="profile-new-pw" minlength="6" required />
          </div>
          <div style="margin-bottom:10px;">
            <label>새 비밀번호 확인 (한 번 더 입력)</label>
            <input type="password" id="profile-new-pw-confirm" minlength="6" required />
          </div>
          <button type="submit">비밀번호 변경하기</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 탭 2: 도구(모듈) 관리 -->
  <div id="admin-sec-modules" class="card hidden" style="border-color:#c084fc;">
    <h3 style="margin-top:0;">도구(모듈) 제목·설명 및 승인 조건 관리</h3>

    <div class="row" style="margin-bottom:14px;">
      <div style="flex:2;">
        <label>도구 제목, 설명 또는 ID 검색</label>
        <input type="text" id="admin-mod-search" placeholder="예: 사전, 문법, 분석기..." oninput="renderAdminModulesPage(1)" />
      </div>
      <div style="flex:1;">
        <label>상태 필터</label>
        <select id="admin-mod-filter" onchange="renderAdminModulesPage(1)">
          <option value="ALL">전체 도구</option>
          <option value="ON">활성(ON)만 보기</option>
          <option value="OFF">비활성(OFF)만 보기</option>
        </select>
      </div>
    </div>

    <div class="list-summary">
      <span id="admin-mod-summary">전체 0개 도구</span>
      <div style="display:flex; align-items:center; gap:6px;">
        <span>페이지당</span>
        <select id="admin-mod-pagesize" style="width:auto; padding:4px 8px;" onchange="renderAdminModulesPage(1)">
          <option value="10" selected>10개</option>
          <option value="20">20개</option>
          <option value="50">50개</option>
        </select>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:22%;">표시 제목 (메뉴명)</th>
          <th style="width:30%;">도구 설명</th>
          <th style="width:10%;">활성</th>
          <th style="width:16%;">접근 조건</th>
          <th style="width:14%;">허용 등급</th>
          <th style="width:8%;">저장</th>
        </tr>
      </thead>
      <tbody id="admin-module-list"></tbody>
    </table>
    <div id="admin-mod-pagination"></div>
  </div>

  <!-- 탭 3: 회원 관리 -->
  <div id="admin-sec-users" class="card hidden" style="border-color:#c084fc;">
    <h3 style="margin-top:0;">회원 등급 및 상태 조절</h3>

    <div class="row" style="margin-bottom:14px;">
      <div style="flex:2;">
        <label>이메일 또는 닉네임 검색</label>
        <input type="text" id="admin-user-search" placeholder="이메일 또는 닉네임 입력..." oninput="renderAdminUsersPage(1)" />
      </div>
      <div style="flex:1;">
        <label>등급 필터</label>
        <select id="admin-user-grade-filter" onchange="renderAdminUsersPage(1)">
          <option value="ALL">전체 등급</option>
        </select>
      </div>
      <div style="flex:1;">
        <label>상태 필터</label>
        <select id="admin-user-status-filter" onchange="renderAdminUsersPage(1)">
          <option value="ALL">전체 상태</option>
          <option value="ACTIVE">활성 회원만</option>
          <option value="SUSPENDED">정지 회원만</option>
        </select>
      </div>
    </div>

    <div class="list-summary">
      <span id="admin-user-summary">전체 0명 회원</span>
      <div style="display:flex; align-items:center; gap:6px;">
        <span>페이지당</span>
        <select id="admin-user-pagesize" style="width:auto; padding:4px 8px;" onchange="renderAdminUsersPage(1)">
          <option value="10" selected>10명</option>
          <option value="20">20명</option>
          <option value="50">50명</option>
        </select>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>이메일</th><th>닉네임</th><th>등급</th><th>상태</th><th>저장</th></tr>
      </thead>
      <tbody id="admin-user-list"></tbody>
    </table>
    <div id="admin-user-pagination"></div>
  </div>

  <!-- 탭 4: 등급 관리 -->
  <div id="admin-sec-grades" class="card hidden" style="border-color:#c084fc;">
    <h3 style="margin-top:0;">회원 등급 생성 및 관리</h3>

    <div style="background:#f8fafc; padding:14px; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:18px;">
      <h4 style="margin:0 0 10px 0;">새 회원 등급 추가</h4>
      <form onsubmit="handleCreateGrade(event)" class="row">
        <div><label>등급 코드 (영문 대문자)</label><input type="text" id="grade-code" placeholder="예: VIP" required /></div>
        <div><label>등급 이름</label><input type="text" id="grade-name" placeholder="예: VIP회원" required /></div>
        <div><label>권한 레벨 (숫자)</label><input type="number" id="grade-level" value="10" required /></div>
        <div style="flex:0;"><button type="submit">등급 추가</button></div>
      </form>
    </div>

    <div class="list-summary">
      <span id="admin-grade-summary">전체 0개 등급</span>
      <div style="display:flex; align-items:center; gap:6px;">
        <span>페이지당</span>
        <select id="admin-grade-pagesize" style="width:auto; padding:4px 8px;" onchange="renderAdminGradesPage(1)">
          <option value="10" selected>10개</option>
          <option value="20">20개</option>
        </select>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>등급 코드</th><th>등급 이름</th><th>권한 레벨</th><th>비고</th></tr>
      </thead>
      <tbody id="admin-grade-list"></tbody>
    </table>
    <div id="admin-grade-pagination"></div>
  </div>

  <!-- 탭 5: 금지 닉네임 단어 관리 (관리자 전용) -->
  <div id="admin-sec-forbidden" class="card hidden" style="border-color:#c084fc;">
    <h3 style="margin-top:0;">사용 불가(금지) 닉네임 단어 사전</h3>
    <p style="font-size:13px; color:#64748b; margin-top:-6px;">
      여기에 등록된 단어가 포함된 닉네임은 회원가입 및 닉네임 변경 시 자동으로 차단됩니다.
    </p>

    <div style="background:#f8fafc; padding:14px; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:18px;">
      <form onsubmit="handleAddForbiddenNickname(event)" class="row">
        <div style="flex:1;">
          <label>금지 단어</label>
          <input type="text" id="fn-word" placeholder="예: 운영팀, 욕설 등" required />
        </div>
        <div style="flex:2;">
          <label>등록 사유 (선택)</label>
          <input type="text" id="fn-reason" placeholder="예: 사칭 방지 또는 부적절한 표현" />
        </div>
        <div style="flex:0;">
          <button type="submit">금지어 등록</button>
        </div>
      </form>
    </div>

    <div class="list-summary">
      <span id="admin-fn-summary">전체 0개 금지어</span>
      <input type="text" id="admin-fn-search" style="width:220px; padding:5px 9px;" placeholder="금지어 검색..." oninput="renderForbiddenNicknamesPage(1)" />
    </div>

    <table>
      <thead>
        <tr><th>금지 단어</th><th>등록 사유</th><th>관리</th></tr>
      </thead>
      <tbody id="admin-fn-list"></tbody>
    </table>
    <div id="admin-fn-pagination"></div>
  </div>
</div>
