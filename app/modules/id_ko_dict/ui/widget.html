<div class="card">
  <h2 id="idko-dict-title" style="margin-top:0;">인도네시아어 - 한국어 사전</h2>

  <!-- 다중 조건 검색 폼 -->
  <form onsubmit="searchIdKoDictionary(event, 1)" style="margin-bottom:16px;">
    <div class="row" style="margin-bottom:8px;">
      <div style="flex:2;">
        <label>단어, 한국어 뜻 또는 어근 검색</label>
        <input type="text" id="idko-search-q" placeholder="예: makan, memakan, 먹다 (비워두면 전체 목차)..." />
      </div>
      <div style="flex:1;">
        <label>형태소 구분</label>
        <select id="idko-search-affix" onchange="searchIdKoDictionary(null, 1)">
          <option value="">전체 (어근 + 파생어)</option>
          <option value="ROOT">어근(Kata Dasar)만</option>
          <option value="AFFIXED">접사 결합어(Kata Berimbuhan)만</option>
        </select>
      </div>
      <div style="flex:1;">
        <label>태그 검색</label>
        <input type="text" id="idko-search-tag" placeholder="예: 기초, 동사" />
      </div>
    </div>

    <div class="row">
      <div style="flex:1;">
        <label>방언 / 지역어 필터</label>
        <select id="idko-search-dialect" onchange="searchIdKoDictionary(null, 1)">
          <option value="">전체 언어/방언</option>
          <option value="표준어">표준어 (Bahasa Baku)</option>
          <option value="자와어">자와어 (Bahasa Jawa)</option>
          <option value="순다어">순다어 (Bahasa Sunda)</option>
          <option value="미낭까바우어">미낭까바우어 (Minangkabau)</option>
          <option value="바딱어">바딱어 (Bahasa Batak)</option>
          <option value="브타위어">브타위어 (Bahasa Betawi)</option>
          <option value="발리어">발리어 (Bahasa Bali)</option>
          <option value="자카르타 구어">자카르타 구어 (Bahasa Gaul)</option>
        </select>
      </div>
      <div style="flex:1;">
        <label>어원 / 단어 유래 필터</label>
        <select id="idko-search-origin" onchange="searchIdKoDictionary(null, 1)">
          <option value="">전체 어원</option>
          <option value="고유어">고유어 (Asli Melayu/Indonesia)</option>
          <option value="산스크리트어">산스크리트어 (Sanskerta)</option>
          <option value="아랍어">아랍어 (Arab)</option>
          <option value="네덜란드어">네덜란드어 (Belanda)</option>
          <option value="포르투갈어">포르투갈어 (Portugis)</option>
          <option value="영어">영어 (Inggris)</option>
          <option value="중국어">중국어/민남어 (Tionghoa)</option>
          <option value="자와어">자와어 유래 (Jawa)</option>
        </select>
      </div>
      <div style="flex:0;">
        <button type="submit">검색</button>
      </div>
    </div>
  </form>

  <!-- 관리자 전용 등록/수정 패널 -->
  <div id="idko-admin-add" class="hidden" style="background:#f1f5f9; padding:16px; border-radius:8px; margin-bottom:16px;">
    <h4 id="idko-form-title" style="margin:0 0 12px 0;">[관리자] 새 인도네시아어 단어 등록</h4>
    <form id="idko-word-form" onsubmit="submitIdKoWord(event)">
      <!-- 1행: 기본 표제어 / 뜻 / 품사 -->
      <div class="row" style="margin-bottom:10px;">
        <div><label>인도네시아어 표제어</label><input type="text" id="idko-head" placeholder="예: memakan" required /></div>
        <div><label>한국어 뜻</label><input type="text" id="idko-mean" placeholder="예: 먹다" required /></div>
        <div>
          <label>품사</label>
          <select id="idko-pos">
            <option value="명사">명사 (Nomina)</option>
            <option value="동사">동사 (Verba)</option>
            <option value="형용사">형용사 (Adjektiva)</option>
            <option value="부사">부사 (Adverbia)</option>
            <option value="전치사">전치사 (Preposisi)</option>
            <option value="접속사">접속사 (Konjungsi)</option>
            <option value="대명사">대명사 (Pronomina)</option>
          </select>
        </div>
      </div>

      <!-- 2행: 어근 및 접사 구조 -->
      <div style="background:#fff; border:1px solid #cbd5e1; border-radius:6px; padding:10px; margin-bottom:10px;">
        <div class="row">
          <div>
            <label>형태소 유형 (어근 / 접사)</label>
            <select id="idko-is-root" onchange="toggleIdKoAffixFields()">
              <option value="true" selected>어근 자체 (Kata Dasar)</option>
              <option value="false">접사가 결합된 단어 (Kata Berimbuhan)</option>
            </select>
          </div>
          <div>
            <label>어근 (Kata Dasar) <small style="color:#64748b;">*같은 어근끼리 자동 묶임</small></label>
            <input type="text" id="idko-root-word" placeholder="어근 입력 (예: makan)" />
          </div>
          <div id="idko-affix-type-box" class="hidden">
            <label>결합된 접사 종류</label>
            <select id="idko-affix-type">
              <option value="접두사(Awalan)">접두사 (Awalan: me-, ber-, di-, ter-, pe-, se-)</option>
              <option value="접미사(Akhiran)">접미사 (Akhiran: -kan, -i, -an, -nya)</option>
              <option value="중간접사(Sisipan)">중간접사 (Sisipan: -el-, -em-, -er-, -in-)</option>
              <option value="양쪽접사(Konfiks)">양쪽접사 (Konfiks: ke-...-an, pe-...-an, per-...-an)</option>
              <option value="복합접사(Simulfiks)">복합접사 (접두사 + 접미사 동시 결합)</option>
            </select>
          </div>
          <div id="idko-affixes-box" class="hidden">
            <label>추가된 접사 (쉼표 구분)</label>
            <input type="text" id="idko-affixes" placeholder="예: me-, -kan 또는 -el-" />
          </div>
        </div>
      </div>

      <!-- 3행: 방언(지역어) 및 어원(단어 유래) -->
      <div style="background:#fff; border:1px solid #cbd5e1; border-radius:6px; padding:10px; margin-bottom:10px;">
        <div class="row">
          <div>
            <label>방언 / 지역어 구분</label>
            <select id="idko-dialect">
              <option value="표준어 (Bahasa Baku)" selected>표준어 (Bahasa Baku)</option>
              <option value="자와어 (Bahasa Jawa)">자와어 (Bahasa Jawa)</option>
              <option value="순다어 (Bahasa Sunda)">순다어 (Bahasa Sunda)</option>
              <option value="미낭까바우어 (Minangkabau)">미낭까바우어 (Minangkabau)</option>
              <option value="바딱어 (Bahasa Batak)">바딱어 (Bahasa Batak)</option>
              <option value="브타위어 (Bahasa Betawi)">브타위어 (Bahasa Betawi)</option>
              <option value="발리어 (Bahasa Bali)">발리어 (Bahasa Bali)</option>
              <option value="부기스/마까사르어">부기스/마까사르어</option>
              <option value="자카르타 구어 (Bahasa Gaul)">자카르타 구어 (Bahasa Gaul)</option>
              <option value="기타 지역어">기타 지역어</option>
            </select>
          </div>
          <div>
            <label>단어의 유래 / 어원</label>
            <select id="idko-origin">
              <option value="고유어 (Asli Melayu/Indonesia)" selected>고유어 (Asli Melayu/Indonesia)</option>
              <option value="산스크리트어 (Sanskerta)">산스크리트어 (Sanskerta)</option>
              <option value="아랍어 (Arab)">아랍어 (Arab)</option>
              <option value="네덜란드어 (Belanda)">네덜란드어 (Belanda)</option>
              <option value="포르투갈어 (Portugis)">포르투갈어 (Portugis)</option>
              <option value="영어 (Inggris)">영어 (Inggris)</option>
              <option value="중국어/민남어 (Tionghoa)">중국어/민남어 (Tionghoa)</option>
              <option value="자와어 유래 (Jawa)">자와어 유래 (Jawa)</option>
              <option value="타밀어 (Tamil)">타밀어 (Tamil)</option>
              <option value="기타 외래어">기타 외래어</option>
            </select>
          </div>
          <div style="flex:1.5;">
            <label>유래/어원 상세 설명 (선택)</label>
            <input type="text" id="idko-origin-note" placeholder="예: 네덜란드어 'kantoor'에서 차용" />
          </div>
        </div>
      </div>

      <!-- 4행: 유의어 / 반대말 / 태그 / 예문 -->
      <div class="row" style="margin-bottom:8px;">
        <div><label>유의어 (쉼표 구분)</label><input type="text" id="idko-syn" /></div>
        <div><label>반대말 (쉼표 구분)</label><input type="text" id="idko-ant" /></div>
        <div><label>태그 (쉼표 구분)</label><input type="text" id="idko-tags" /></div>
      </div>
      <div class="row" style="margin-bottom:10px;">
        <div><label>예문 (인도네시아어)</label><input type="text" id="idko-ex1" /></div>
        <div><label>예문 해석 (한국어)</label><input type="text" id="idko-ex2" /></div>
      </div>

      <div style="display:flex; gap:8px;">
        <button type="submit" id="idko-submit-btn">단어 등록하기</button>
        <button type="button" id="idko-cancel-btn" class="secondary hidden" onclick="cancelEditIdKoWord()">수정 취소</button>
      </div>
    </form>
  </div>

  <!-- 목록 요약 및 페이지당 개수 -->
  <div class="list-summary">
    <span id="idko-total-info">전체 0개 항목</span>
    <div style="display:flex; align-items:center; gap:6px;">
      <span>페이지당</span>
      <select id="idko-page-size" style="width:auto; padding:4px 8px;" onchange="searchIdKoDictionary(null, 1)">
        <option value="15" selected>15개</option>
        <option value="30">30개</option>
        <option value="50">50개</option>
      </select>
    </div>
  </div>

  <div id="idko-results"></div>
  <div id="idko-pagination"></div>
</div>
