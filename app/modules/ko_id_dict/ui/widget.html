<div class="card">
  <h2 id="dict-title" style="margin-top:0;">한국어 - 인도네시아어 사전</h2>

  <form onsubmit="searchDictionary(event, 1)" class="row" style="margin-bottom:16px;">
    <div style="flex:2;">
      <label>단어 또는 뜻 검색</label>
      <input type="text" id="search-q" placeholder="검색어를 입력하세요 (비워두면 전체 목차 표시)..." />
    </div>
    <div style="flex:1;">
      <label>태그 검색</label>
      <input type="text" id="search-tag" placeholder="예: 기초, 동사, 여행" />
    </div>
    <div style="flex:0;">
      <button type="submit">검색</button>
    </div>
  </form>

  <div id="dict-admin-add" class="hidden" style="background:#f1f5f9; padding:14px; border-radius:8px; margin-bottom:16px;">
    <h4 id="dict-form-title" style="margin:0 0 10px 0;">[관리자] 새 단어 등록</h4>
    <form id="dict-word-form" onsubmit="submitDictWord(event)">
      <div class="row" style="margin-bottom:8px;">
        <div><label id="lbl-word">한국어 표제어</label><input type="text" id="w-head" required /></div>
        <div><label id="lbl-meaning">인도네시아어 뜻</label><input type="text" id="w-mean" required /></div>
        <div>
          <label>품사</label>
          <select id="w-pos">
            <option value="명사">명사</option>
            <option value="동사">동사</option>
            <option value="형용사">형용사</option>
            <option value="부사">부사</option>
            <option value="전치사">전치사</option>
            <option value="접속사">접속사</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <div><label>유의어 (쉼표 구분)</label><input type="text" id="w-syn" /></div>
        <div><label>반대말 (쉼표 구분)</label><input type="text" id="w-ant" /></div>
        <div><label>태그 (쉼표 구분)</label><input type="text" id="w-tags" /></div>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <div><label id="lbl-ex1">예문 (한국어)</label><input type="text" id="w-ex1" /></div>
        <div><label id="lbl-ex2">예문 번역 (인도네시아어)</label><input type="text" id="w-ex2" /></div>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="submit" id="dict-submit-btn">단어 등록하기</button>
        <button type="button" id="dict-cancel-btn" class="secondary hidden" onclick="cancelEditDictWord()">수정 취소</button>
      </div>
    </form>
  </div>

  <!-- 목차 요약 및 페이지당 개수 선택 -->
  <div class="list-summary">
    <span id="dict-total-info">전체 0개 항목</span>
    <div style="display:flex; align-items:center; gap:6px;">
      <span>페이지당</span>
      <select id="dict-page-size" style="width:auto; padding:4px 8px;" onchange="searchDictionary(null, 1)">
        <option value="15" selected>15개</option>
        <option value="30">30개</option>
        <option value="50">50개</option>
      </select>
    </div>
  </div>

  <div id="dict-results"></div>
  <div id="dict-pagination"></div>
</div>
