<div class="card">
  <h2 style="margin-top:0;">한-인 단어시험</h2>
  <p style="font-size:13px; color:#64748b; margin-top:-6px;">
    유의어 및 같은 의미의 단어가 보기에 중복 출제되지 않도록 자동 필터링됩니다.
  </p>

  <!-- 1단계: 시험 설정 화면 -->
  <div id="quiz-setup-view" style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:18px;">
    <form onsubmit="startVocabQuiz(event)">
      <div class="row" style="margin-bottom:12px;">
        <div>
          <label>문제 개수 (1 ~ 100문제)</label>
          <input type="number" id="qz-count" value="10" min="1" max="100" required />
        </div>
        <div>
          <label>제한 시간 (분)</label>
          <input type="number" id="qz-minutes" value="3" min="1" max="60" required />
        </div>
        <div>
          <label>초 단위 추가 (선택)</label>
          <input type="number" id="qz-seconds" value="0" min="0" max="59" />
        </div>
      </div>

      <div class="row" style="margin-bottom:14px;">
        <div>
          <label>출제 유형</label>
          <select id="qz-direction">
            <option value="ko_to_id" selected>한국어 → 인도네시아어 뜻 고르기</option>
            <option value="id_to_ko">인도네시아어 → 한국어 단어 고르기</option>
            <option value="mixed">혼합 출제 (한국어 ↔ 인도네시아어)</option>
          </select>
        </div>
        <div>
          <label>특정 태그만 출제 (선택)</label>
          <input type="text" id="qz-tag" placeholder="비워두면 전체 사전에서 출제 (예: 기초, 동사)" />
        </div>
      </div>

      <button type="submit" style="width:100%; padding:11px; font-size:14px;">단어시험 시작하기</button>
    </form>
  </div>

  <!-- 2단계: 시험 응시 화면 (상단 고정 타이머 바 + 문제 목록) -->
  <div id="quiz-play-view" class="hidden">
    <div style="position:sticky; top:0; z-index:50; background:#1e293b; color:#fff; padding:12px 16px; border-radius:8px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <div>
        <span style="font-size:13px; color:#94a3b8;">진행 현황:</span>
        <strong id="qz-progress-text" style="font-size:15px; margin-left:4px;">0 / 0 완료</strong>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="qz-timer-display" style="font-size:18px; font-weight:800; color:#38bdf8;">00:00</span>
        <button type="button" style="background:#16a34a; padding:7px 14px;" onclick="finishVocabQuiz(false)">답안 제출 및 채점</button>
      </div>
    </div>

    <div id="qz-questions-container"></div>

    <div style="margin-top:18px; display:flex; gap:10px;">
      <button type="button" style="flex:1; background:#16a34a; padding:11px;" onclick="finishVocabQuiz(false)">시험 종료 및 채점하기</button>
      <button type="button" class="secondary" onclick="resetVocabQuizToSetup()">시험 중단</button>
    </div>
  </div>

  <!-- 3단계: 채점 결과 및 오답 분석 화면 -->
  <div id="quiz-result-view" class="hidden">
    <div id="qz-score-summary" style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:20px; text-align:center; margin-bottom:18px;"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
      <h3 style="margin:0;">문항별 채점 결과</h3>
      <div style="display:flex; gap:8px;">
        <button type="button" id="btn-filter-all" style="padding:5px 10px; font-size:12px;" onclick="filterQuizResults('ALL')">전체 문항</button>
        <button type="button" id="btn-filter-wrong" class="secondary" style="padding:5px 10px; font-size:12px;" onclick="filterQuizResults('WRONG')">틀린 문제만 보기</button>
      </div>
    </div>

    <div id="qz-result-list"></div>

    <div style="margin-top:18px; display:flex; gap:10px;">
      <button type="button" style="flex:1;" onclick="resetVocabQuizToSetup()">새 조건으로 다시 시험 보기</button>
    </div>
  </div>
</div>
