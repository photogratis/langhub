<div class="module-box">
  <!-- 상단 탭 -->
  <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
    <button type="button" id="kyt-tab-study" onclick="switchKytTab('study')">📺 영상·자막 동기화 학습</button>
    <button type="button" id="kyt-tab-admin" class="secondary kyt-staff-only hidden" onclick="switchKytTab('admin')">➕ 유튜브 링크 & 자막 등록</button>
  </div>

  <!-- =====================================================
       탭 1: 학습자 플레이어 & 타임스탬프 싱크 뷰
  ====================================================== -->
  <div id="kyt-view-study">
    <div class="row" style="margin-bottom:12px;">
      <div style="flex:1;">
        <select id="kyt-filter-level" onchange="loadKytVideos()">
          <option value="">전체 난이도</option>
          <option value="초급">초급</option>
          <option value="중급">중급</option>
          <option value="고급">고급</option>
        </select>
      </div>
      <div style="flex:1;">
        <input type="text" id="kyt-filter-tag" placeholder="태그 검색..." oninput="loadKytVideos()" />
      </div>
      <div style="flex:2;">
        <input type="text" id="kyt-filter-q" placeholder="영상 제목 검색..." oninput="loadKytVideos()" />
      </div>
    </div>

    <!-- 영상 카드 목록 -->
    <div id="kyt-video-list" style="margin-bottom:16px;"></div>

    <!-- 선택된 영상 동기화 플레이어 스튜디오 -->
    <div id="kyt-player-studio" class="hidden" style="background:#f8fafc; border:2px solid #cbd5e1; border-radius:12px; padding:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
        <div>
          <span class="pos-badge" id="kyt-active-level">초급</span>
          <strong id="kyt-active-title" style="font-size:18px; color:#0f172a; margin-left:6px;"></strong>
        </div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:4px; font-size:13px; margin:0; cursor:pointer;">
            <input type="checkbox" id="kyt-auto-scroll" checked style="width:auto;" /> 자막 자동 스크롤
          </label>
          <label style="display:flex; align-items:center; gap:4px; font-size:13px; margin:0; cursor:pointer;">
            <input type="checkbox" id="kyt-show-id" checked style="width:auto;" onchange="renderKytSubtitleTimeline()" /> 인도네시아어 번역 표시
          </label>
        </div>
      </div>

      <!-- 좌측 유튜브 IFrame / 우측 실시간 동기화 자막 -->
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; align-items:start;">
        <div>
          <div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:10px; background:#000;">
            <div id="kyt-iframe-target" style="position:absolute; top:0; left:0; width:100%; height:100%;"></div>
          </div>
          <div id="kyt-active-desc" style="margin-top:10px; font-size:13.5px; color:#475569; line-height:1.5;"></div>
        </div>

        <div style="background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:10px;">
          <div style="font-size:12.5px; color:#64748b; padding:4px 8px 8px 8px; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between;">
            <span>💡 문장을 클릭하면 해당 영상 시간으로 이동합니다</span>
            <span id="kyt-current-time-badge" style="font-weight:700; color:#2563eb;">00:00</span>
          </div>
          <div id="kyt-subtitle-timeline" style="max-height:420px; overflow-y:auto; padding:6px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- =====================================================
       탭 2: 관리자/선생님 영상 등록 & 자막 추출 / 음성인식 캡처
  ====================================================== -->
  <div id="kyt-view-admin" class="hidden">
    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:16px; margin-bottom:16px;">
      <h4 style="margin:0 0 12px 0;">유튜브 학습 영상 등록 및 타임스탬프 자막 생성</h4>

      <div class="row" style="margin-bottom:10px;">
        <div style="flex:3;">
          <label>유튜브 링크 (URL)</label>
          <input type="text" id="kyt-new-url" placeholder="https://www.youtube.com/watch?v=..." />
        </div>
        <div style="flex:1; display:flex; align-items:flex-end;">
          <button type="button" style="width:100%; background:#2563eb;" onclick="extractSubtitlesFromUrl()">
            🔍 자막·번역 자동 추출
          </button>
        </div>
      </div>

      <div class="row" style="margin-bottom:10px;">
        <div style="flex:2;">
          <label>학습 콘텐츠 제목</label>
          <input type="text" id="kyt-new-title" placeholder="예: [초급 회화] 카페에서 주문하기" />
        </div>
        <div style="flex:1;">
          <label>난이도</label>
          <select id="kyt-new-level">
            <option value="초급">초급</option>
            <option value="중급">중급</option>
            <option value="고급">고급</option>
          </select>
        </div>
        <div style="flex:1;">
          <label>태그 (쉼표 구분)</label>
          <input type="text" id="kyt-new-tags" placeholder="예: 회화, 카페, 뉴스" />
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <label>학습 안내 메모 (선택)</label>
        <input type="text" id="kyt-new-desc" placeholder="핵심 표현이나 학습 팁을 적어주세요." />
      </div>

      <!-- 자막이 없는 영상일 때: 영상 재생 + 음성인식(STT) 타임스탬프 캡처 도구 -->
      <div id="kyt-stt-capture-box" class="hidden" style="background:#fffbeb; border:1px solid #fcd34d; border-radius:8px; padding:12px; margin-bottom:12px;">
        <div style="font-weight:700; color:#92400e; font-size:13.5px; margin-bottom:6px;">
          🎤 자막 없는 영상용 — 실시간 음성인식(STT) 타임스탬프 생성기
        </div>
        <p style="font-size:12.5px; color:#78350f; margin:0 0 8px 0;">
          아래 미리보기 영상을 재생하면서 [음성인식 타임스탬프 캡처 시작]을 누르면, 영상의 현재 재생 시간(초)과 인식된 한국어 문장이 자동으로 기록됩니다.
        </p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:center;">
          <div style="position:relative; padding-bottom:56.25%; height:0; background:#000; border-radius:6px; overflow:hidden;">
            <div id="kyt-admin-preview-player" style="position:absolute; top:0; left:0; width:100%; height:100%;"></div>
          </div>
          <div>
            <button type="button" id="kyt-btn-stt-start" style="background:#d97706; margin-bottom:8px;" onclick="startAdminSttCapture()">
              🎙️ 음성인식 타임스탬프 캡처 시작
            </button>
            <button type="button" id="kyt-btn-stt-stop" class="hidden" style="background:#dc2626; margin-bottom:8px;" onclick="stopAdminSttCapture()">
              ⏹️ 캡처 중지
            </button>
            <div id="kyt-stt-live-status" style="font-size:12.5px; color:#475569;">대기 중</div>
          </div>
        </div>
      </div>

      <!-- 추출/인식된 타임스탬프 자막 편집 테이블 -->
      <div style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <strong style="font-size:13.5px;">타임스탬프 자막 목록 (수정·추가 가능)</strong>
          <button type="button" class="secondary" style="padding:4px 10px; font-size:12px;" onclick="addManualSubtitleRow()">+ 줄 추가</button>
        </div>
        <div id="kyt-draft-subtitles-list" style="max-height:320px; overflow-y:auto; border:1px solid #cbd5e1; border-radius:8px; background:#fff; padding:8px;">
          <p style="color:#64748b; text-align:center; font-size:13px; padding:16px;">
            유튜브 링크를 입력하고 [자막·번역 자동 추출]을 누르거나 [+ 줄 추가]로 입력하세요.
          </p>
        </div>
      </div>

      <button type="button" style="background:#16a34a; padding:10px 18px;" onclick="saveNewYoutubeVideo()">
        💾 유튜브 학습 콘텐츠 저장하기
      </button>
    </div>

    <!-- 기존 등록 목록 -->
    <div id="kyt-admin-video-list"></div>
  </div>
</div>
