<div class="card">
  <h2 id="grammar-title" style="margin-top:0;">한국어 문법사전 & 말뭉치 연동</h2>

  <form onsubmit="searchGrammar(event, 1)" class="row" style="margin-bottom:16px;">
    <div style="flex:2;">
      <label>문법 패턴 또는 의미 검색</label>
      <input type="text" id="g-search-q" placeholder="예: -아/어서, karena (비워두면 전체 목차 표시)..." />
    </div>
    <div style="flex:1;">
      <label>태그 검색</label>
      <input type="text" id="g-search-tag" placeholder="예: 이유, 초급" />
    </div>
    <div style="flex:0;">
      <button type="submit">검색</button>
    </div>
  </form>

  <div id="grammar-admin-area" class="hidden">
    <div style="background:#f1f5f9; padding:14px; border-radius:8px; margin-bottom:14px;">
      <h4 id="grammar-form-title" style="margin:0 0 10px 0;">[관리자] ① 새 한국어 문법 등록</h4>
      <form id="grammar-item-form" onsubmit="submitGrammarItem(event)">
        <div class="row" style="margin-bottom:8px;">
          <div><label>문법 패턴</label><input type="text" id="g-pattern" placeholder="예: -아/어서" required /></div>
          <div><label>인도네시아어 의미</label><input type="text" id="g-meaning" placeholder="예: karena / lalu" required /></div>
          <div>
            <label>난이도</label>
            <select id="g-level">
              <option value="초급">초급</option>
              <option value="중급">중급</option>
              <option value="고급">고급</option>
            </select>
          </div>
        </div>
        <div class="row" style="margin-bottom:8px;">
          <div style="flex:2;"><label>결합 규칙 설명</label><input type="text" id="g-rule" placeholder="예: 동사/형용사 어간 뒤에 결합" /></div>
          <div style="flex:1;"><label>태그 (쉼표 구분)</label><input type="text" id="g-tags" placeholder="예: 이유, 연결어미" /></div>
        </div>
        <div class="row" style="margin-bottom:8px;">
          <div><label>기본 예문 (한국어)</label><input type="text" id="g-ex-ko" placeholder="예: 배가 고파서 밥을 먹었어요." /></div>
          <div><label>기본 예문 (인도네시아어)</label><input type="text" id="g-ex-id" placeholder="예: Karena lapar, saya makan nasi." /></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="submit" id="grammar-submit-btn">문법 등록하기</button>
          <button type="button" id="grammar-cancel-btn" class="secondary hidden" onclick="cancelEditGrammarItem()">수정 취소</button>
        </div>
      </form>
    </div>

<div id="grammar-corpus-box" style="background:#f5f3ff; border:1px solid #ddd6fe; padding:14px; border-radius:8px; margin-bottom:16px;">
      <h4 id="corpus-form-title" style="margin:0 0 10px 0; color:#5b21b6;">[연결 모듈] ② 한-인사전 단어 + 문법 검색 결합 말뭉치 저장</h4>
      <form onsubmit="submitLinkedCorpus(event)">
        <div class="row" style="margin-bottom:8px;">
          <div class="picker-box">
            <label>① 한-인사전 단어 검색 및 선택</label>
            <input type="hidden" id="selected-word-id" />
            <div id="selected-word-chip" class="selected-chip hidden">
              <span id="selected-word-text"></span>
              <button type="button" class="chip-clear" onclick="clearPickedWord()">✕</button>
            </div>
            <input type="text" id="picker-word-input" placeholder="한국어 또는 인니어 뜻 입력..." autocomplete="off" oninput="onSearchWordPicker(this.value)" onfocus="onSearchWordPicker(this.value)" />
            <div id="picker-word-dropdown" class="picker-dropdown hidden"></div>
          </div>

          <div class="picker-box">
            <label>② 한국어 문법 검색 및 선택</label>
            <input type="hidden" id="selected-grammar-id" />
            <div id="selected-grammar-chip" class="selected-chip hidden">
              <span id="selected-grammar-text"></span>
              <button type="button" class="chip-clear" onclick="clearPickedGrammar()">✕</button>
            </div>
            <input type="text" id="picker-grammar-input" placeholder="문법 패턴 또는 의미 입력..." autocomplete="off" oninput="onSearchGrammarPicker(this.value)" onfocus="onSearchGrammarPicker(this.value)" />
            <div id="picker-grammar-dropdown" class="picker-dropdown hidden"></div>
          </div>

          <div>
            <label>③ 활용 메모 (선택)</label>
            <input type="text" id="corpus-note" placeholder="예: 먹다 + -어서 → 먹어서" />
          </div>
        </div>

        <div class="row" style="margin-bottom:8px;">
          <div><label>말뭉치 문장 (한국어)</label><input type="text" id="corpus-sent-ko" placeholder="예: 시간이 없어서 밥을 못 먹었어요." required /></div>
          <div><label>말뭉치 번역 (인도네시아어)</label><input type="text" id="corpus-sent-id" placeholder="예: Karena tidak ada waktu, saya tidak bisa makan." required /></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="submit" id="corpus-submit-btn" style="background:#7c3aed;">말뭉치 연결 및 저장</button>
          <button type="button" id="corpus-cancel-btn" class="secondary hidden" onclick="cancelEditLinkedCorpus()">수정 취소</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 문법 목차 요약 및 페이지당 개수 선택 -->
  <div class="list-summary">
    <span id="grammar-total-info">전체 0개 문법</span>
    <div style="display:flex; align-items:center; gap:6px;">
      <span>페이지당</span>
      <select id="grammar-page-size" style="width:auto; padding:4px 8px;" onchange="searchGrammar(null, 1)">
        <option value="15" selected>15개</option>
        <option value="30">30개</option>
        <option value="50">50개</option>
      </select>
    </div>
  </div>

  <div id="grammar-results"></div>
  <div id="grammar-pagination"></div>

    <div style="margin-top:24px;">
        <div class="list-summary">
            <h3 style="margin:0; color:#5b21b6;">저장된 말뭉치 목록 (한-인사전 ↔ 문법사전 연동)</h3>
            <span id="grammar-corpus-total">전체 0개</span>
        </div>
        <div id="corpus-list"></div>
        <div id="corpus-pagination"></div>
    </div>
</div>
